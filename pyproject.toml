[project]
name = "sipeed-wiki"
version = "0.1.0"
description = "Sipeed wiki source docs, built with teedoc"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "setuptools==83.0.0",
    "teedoc==1.37.9",
    "teedoc-plugin-ad-hint==1.1.3",
    "teedoc-plugin-assets==1.1.2",
    "teedoc-plugin-baidu-tongji==1.0.4",
    "teedoc-plugin-blog==1.1.6",
    "teedoc-plugin-comments-gitalk==1.5.0",
    "teedoc-plugin-google-analytics==1.0.1",
    "teedoc-plugin-google-translate==1.1.6",
    "teedoc-plugin-jupyter-notebook-parser==1.4.0",
    "teedoc-plugin-markdown-parser==2.11.0",
    "teedoc-plugin-search==1.5.3",
    "teedoc-plugin-theme-default==1.25.0",
    "teedoc-plugin-thumbs-up==1.0.2",
]

[tool.uv]
package = false
